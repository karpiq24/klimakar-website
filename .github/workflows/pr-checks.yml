name: PR checks

# Checks pull requests only; deploys nothing (production upload to OVH stays manual, see README › Deployment).
# Public repo: runs on GitHub-hosted runners only, never self-hosted.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Same command as locally (AGENTS.md › Process): php -l, astro check, build:all, internal links.
      # PHP CLI is preinstalled on ubuntu-latest. `check:ads` is not run here: it reads
      # private/ads/campaigns.yaml from the private repo, which this public repo's CI must not access.
      - name: Verify (npm run verify)
        run: npm run verify
